<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Sign in</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(199, 210, 254, 0.38), transparent 38%),
        radial-gradient(ellipse at 85% 85%, rgba(191, 219, 254, 0.42), transparent 36%),
        #f5f7fb;
    }

    .login-card {
      width: min(100%, 420px);
      padding: 40px;
      border: 1px solid #e7eaf1;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(29, 42, 74, 0.1);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      margin-bottom: 28px;
      border-radius: 13px;
      background: #4f46e5;
      color: #fff;
      font-size: 21px;
      font-weight: 700;
      box-shadow: 0 7px 16px rgba(79, 70, 229, 0.24);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.8px;
    }

    .intro {
      margin: 9px 0 30px;
      color: #687187;
      font-size: 15px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #30394d;
      font-size: 13px;
      font-weight: 600;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #dce1eb;
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: #172033;
      font: inherit;
      font-size: 14px;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    input::placeholder {
      color: #a0a8b8;
    }

    input:focus {
      border-color: #6962eb;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.13);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 13px;
      padding: 4px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #625bea;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 0 24px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #687187;
      cursor: pointer;
      font-weight: 400;
    }

    .remember input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: #4f46e5;
    }

    a {
      color: #5149d8;
      font-weight: 600;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .submit-button {
      width: 100%;
      height: 49px;
      border: 0;
      border-radius: 9px;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      transition: background 140ms ease, transform 140ms ease;
    }

    .submit-button:hover {
      background: #4338ca;
    }

    .submit-button:active {
      transform: translateY(1px);
    }

    .message {
      min-height: 20px;
      margin: 13px 0 0;
      color: #687187;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .signup {
      margin: 23px 0 0;
      color: #687187;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">✦</div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to your account to continue.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button class="show-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox">
          Remember me
        </label>
        <a href="mailto:support@example.com?subject=Password%20reset">Forgot password?</a>
      </div>

      <button class="submit-button" type="submit">Sign in</button>
      <p class="message" id="form-message" role="status" aria-live="polite"></p>
    </form>

    <p class="signup">Don't have an account? <a href="mailto:support@example.com?subject=Create%20an%20account">Contact us</a></p>
  </main>

  <script>
    const passwordInput = document.querySelector("#password");
    const showPasswordButton = document.querySelector(".show-password");
    const loginForm = document.querySelector("#login-form");
    const formMessage = document.querySelector("#form-message");

    showPasswordButton.addEventListener("click", () => {
      const isPasswordVisible = passwordInput.type === "text";
      passwordInput.type = isPasswordVisible ? "password" : "text";
      showPasswordButton.textContent = isPasswordVisible ? "Show" : "Hide";
      showPasswordButton.setAttribute("aria-pressed", String(!isPasswordVisible));
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      formMessage.textContent = "Login successful! (Demo only — no authentication was performed.)";
    });
  </script>
</body>
</html>
